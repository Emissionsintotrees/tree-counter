<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="HandheldFriendly" content="true" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tree Counter" />
  <title>Tree Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #253f0d; }
    body {
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      position: relative;
    }
    .tag-line {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 12px;
    }
    .heading {
      font-size: clamp(36px, 9vw, 72px);
      font-weight: 900;
      line-height: 1.05;
      color: #ffffff;
      text-align: center;
      margin-bottom: 28px;
      padding: 0 20px;
    }
    .ground-strip {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 90px;
      background: #162508;
      border-top: 1px solid #0d1a04;
      z-index: 1;
    }
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 110px;
      width: 100%;
    }
    .counter-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }
    .label {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-bottom: 4px;
    }
    .count-display {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: clamp(120px, 35vw, 240px);
      line-height: 1;
      color: #ffffff;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.2s;
    }
    .count-display.bump { transform: scale(1.08); color: #8fcc5a; }
    .btn-wrap { position: relative; }
    .milestone-badge {
      position: absolute;
      top: -18px; left: 50%;
      transform: translateX(-50%);
      background: #8fcc5a;
      color: #1a3a08;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 4px 16px;
      border-radius: 50px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    .milestone-badge.show { opacity: 1; }
    .add-btn {
      display: inline-flex;
      align-items: center;
      padding: 20px 52px;
      font-family: 'Montserrat', sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #253f0d;
      background: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.1s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .add-btn.pressed {
      background: transparent;
      color: #ffffff;
      transform: scale(0.97);
    }
    .sub-msg {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 300;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.03em;
    }
    .logo-bottom {
      width: 160px;
      margin-top: 20px;
      opacity: 0.9;
    }
    .confetti-container {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 20;
    }
    .confetti-piece {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 2px;
      animation: fall 1.3s ease-in forwards;
    }
    @keyframes fall {
      0%   { transform: translateY(-30px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(400deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="confetti-container" id="confetti"></div>
  <div class="content">
    <div class="tag-line">One coffee = 1 tree planted</div>
    <div class="heading">Climate action,<br>now pouring</div>
    <div class="counter-row">
      <div class="label">Trees planted today</div>
      <div class="count-display" id="count">0</div>
    </div>
    <div class="btn-wrap">
      <div class="milestone-badge" id="badge"></div>
      <button class="add-btn" id="addBtn" aria-label="Add your tree">
        Add your tree
      </button>
    </div>
    <div class="sub-msg" id="subMsg">Buy a coffee, plant a tree</div>

  <div class="ground-strip"></div>

  <script>
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxzDc7XG9VuyXYILfwxSTrK5uneVR9COSGpGz8_caH-5Jn8kR1o46xUnGG_32pj_ZGRuA/exec';
    let count = 0, offlineQueue = [], isSyncing = false;
    const MILESTONES = {5:'5 trees planted!',10:'10 trees!',25:'25 trees!',50:'50 trees — incredible!',100:'100 trees!'};
    const countEl    = document.getElementById('count');
    const badge      = document.getElementById('badge');
    const subMsg     = document.getElementById('subMsg');
    const confettiEl = document.getElementById('confetti');
    const btn        = document.getElementById('addBtn');
    const msgs = ['Buy a coffee, plant a tree','Thank you!','Keep them coming!','Every cup counts.','The forest is growing.','Amazing — keep going!','You\'re making a difference.'];
    const confettiColors = ['#8fcc5a','#ffffff','#c8e9a0','#253f0d','#d4f0a0'];

    async function logToSheet(timestamp, total) {
      await fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ timestamp, total }) });
    }
    async function flushQueue() {
      if (isSyncing || offlineQueue.length === 0) return;
      isSyncing = true;
      const toSync = [...offlineQueue]; offlineQueue = [];
      for (const entry of toSync) { try { await logToSheet(entry.timestamp, entry.total); } catch(e) { offlineQueue.unshift(entry); } }
      isSyncing = false;
    }
    window.addEventListener('online', () => { flushQueue(); });

    async function addTree() {
      count++;
      countEl.classList.remove('bump'); void countEl.offsetWidth; countEl.classList.add('bump');
      setTimeout(() => countEl.classList.remove('bump'), 300);
      countEl.textContent = count;
      subMsg.textContent = count === 1 ? 'Thank you!' : msgs[Math.min(count - 1, msgs.length - 1)];
      if (MILESTONES[count]) { badge.textContent = MILESTONES[count]; badge.classList.add('show'); launchConfetti(); setTimeout(() => badge.classList.remove('show'), 3000); }
      const entry = { timestamp: new Date().toLocaleString('en-AU', { timeZone: 'Australia/Perth' }), total: count };
      if (navigator.onLine) { try { await logToSheet(entry.timestamp, entry.total); } catch(e) { offlineQueue.push(entry); } }
      else { offlineQueue.push(entry); }
    }

    btn.addEventListener('mousedown', () => btn.classList.add('pressed'));
    btn.addEventListener('mouseup', () => { btn.classList.remove('pressed'); addTree(); });
    btn.addEventListener('mouseleave', () => btn.classList.remove('pressed'));
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); btn.classList.add('pressed'); }, {passive:false});
    btn.addEventListener('touchend', (e) => { e.preventDefault(); btn.classList.remove('pressed'); addTree(); });

    function launchConfetti() {
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const p = document.createElement('div'); p.className = 'confetti-piece';
          p.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
          p.style.left = (5 + Math.random() * 90) + '%';
          p.style.animationDuration = (1.0 + Math.random() * 0.7) + 's';
          confettiEl.appendChild(p); setTimeout(() => p.remove(), 1800);
        }, i * 50);
      }
    }
  </script>
