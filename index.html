<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="HandheldFriendly" content="true" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tree Counter" />
  <title>Tree Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #3B6D11; }
    body {
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      position: relative;
    }
    .ground-strip {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 100px;
      background: #27500A;
      border-top: 1px solid #173404;
      z-index: 1;
    }
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 120px;
    }
    .logo {
      width: 160px;
      margin-bottom: 24px;
    }
    .label {
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9FE1CB;
      margin-bottom: 4px;
    }
    .count-display {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: clamp(140px, 38vw, 260px);
      line-height: 1;
      color: #EAF3DE;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.2s;
    }
    .count-display.bump { transform: scale(1.08); color: #FAC775; }
    .sublabel {
      font-size: 14px;
      font-weight: 300;
      color: #9FE1CB;
      margin-top: 8px;
      margin-bottom: 28px;
      letter-spacing: 0.04em;
    }
    .btn-wrap { position: relative; }
    .milestone-badge {
      position: absolute;
      top: -16px; left: 50%;
      transform: translateX(-50%);
      background: #FAC775;
      color: #412402;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 4px 14px;
      border-radius: 50px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    .milestone-badge.show { opacity: 1; }
    .add-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 18px 44px;
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #27500A;
      background: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.1s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .add-btn.pressed {
      background: transparent;
      color: #ffffff;
      transform: scale(0.97);
    }
    .sync-status {
      margin-top: 16px;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #9FE1CB;
      opacity: 0;
      transition: opacity 0.4s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sync-status.show { opacity: 1; }
    .sync-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #9FE1CB;
      flex-shrink: 0;
    }
    .sync-status.offline .sync-dot { background: #FAC775; }
    .sync-status.offline { color: #FAC775; }
    .sync-status.syncing .sync-dot {
      background: #9FE1CB;
      animation: pulse 0.8s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .confetti-container {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 20;
    }
    .confetti-piece {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 2px;
      animation: fall 1.3s ease-in forwards;
    }
    @keyframes fall {
      0%   { transform: translateY(-30px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(400deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="confetti-container" id="confetti"></div>
  <div class="content">
    <img class="logo" src="CarbonNeutralLogo-Primary-White.png" alt="Carbon Neutral" />
    <div class="label">Trees Planted</div>
    <div class="count-display" id="count">0</div>
    <div class="sublabel" id="sublabel">Plant your first tree</div>
    <div class="btn-wrap">
      <div class="milestone-badge" id="badge"></div>
      <button class="add-btn" id="addBtn" aria-label="Plant a tree">
        + Plant a tree
      </button>
    </div>
    <div class="sync-status" id="syncStatus">
      <span class="sync-dot"></span>
      <span id="syncText"></span>
    </div>
  </div>
  <div class="ground-strip"></div>
  <script>
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxzDc7XG9VuyXYILfwxSTrK5uneVR9COSGpGz8_caH-5Jn8kR1o46xUnGG_32pj_ZGRuA/exec';
    let count = 0, offlineQueue = [], isSyncing = false;
    const MILESTONES = {5:'High five! 5 trees!',10:'10 trees planted!',25:'Incredible! 25 trees!',50:'Forest mode: 50 trees!',100:'Century club: 100 trees!'};
    const countEl = document.getElementById('count');
    const sublabel = document.getElementById('sublabel');
    const badge = document.getElementById('badge');
    const confettiEl = document.getElementById('confetti');
    const btn = document.getElementById('addBtn');
    const syncStatus = document.getElementById('syncStatus');
    const syncText = document.getElementById('syncText');
    const subLabels = ['Plant your first tree','One tree at a time!','Watch your forest grow.','Every tree matters.','The earth thanks you.','Roots run deep.','Canopy incoming!'];
    const confettiColors = ['#9FE1CB','#FAC775','#EAF3DE','#C0DD97','#ffffff'];

    function showSync(type, msg) { syncStatus.className = 'sync-status show ' + type; syncText.textContent = msg; }
    function hideSync() { syncStatus.classList.remove('show'); }

    async function logToSheet(timestamp, total) {
      await fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ timestamp, total }) });
    }

    async function flushQueue() {
      if (isSyncing || offlineQueue.length === 0) return;
      isSyncing = true;
      showSync('syncing', 'Syncing ' + offlineQueue.length + ' offline record' + (offlineQueue.length > 1 ? 's' : '') + '...');
      const toSync = [...offlineQueue]; offlineQueue = [];
      for (const entry of toSync) { try { await logToSheet(entry.timestamp, entry.total); } catch(e) { offlineQueue.unshift(entry); } }
      isSyncing = false;
      if (offlineQueue.length === 0) { showSync('', 'Synced to Google Sheets'); setTimeout(hideSync, 3000); }
      else { showSync('offline', offlineQueue.length + ' record(s) still pending'); }
    }

    window.addEventListener('online', () => { flushQueue(); });

    async function addTree() {
      count++;
      countEl.classList.remove('bump'); void countEl.offsetWidth; countEl.classList.add('bump');
      setTimeout(() => countEl.classList.remove('bump'), 300);
      countEl.textContent = count;
      sublabel.textContent = count === 1 ? 'Great start!' : subLabels[Math.min(count-1, subLabels.length-1)];
      if (MILESTONES[count]) { badge.textContent = MILESTONES[count]; badge.classList.add('show'); launchConfetti(); setTimeout(() => badge.classList.remove('show'), 3000); }
      const entry = { timestamp: new Date().toLocaleString('en-AU', { timeZone: 'Australia/Perth' }), total: count };
      if (navigator.onLine) {
        try { showSync('syncing', 'Saving...'); await logToSheet(entry.timestamp, entry.total); showSync('', 'Saved to Google Sheets'); setTimeout(hideSync, 2000); }
        catch(e) { offlineQueue.push(entry); showSync('offline', 'Offline — ' + offlineQueue.length + ' record(s) queued'); }
      } else { offlineQueue.push(entry); showSync('offline', 'Offline — ' + offlineQueue.length + ' record(s) queued'); }
    }

    btn.addEventListener('mousedown', () => btn.classList.add('pressed'));
    btn.addEventListener('mouseup', () => { btn.classList.remove('pressed'); addTree(); });
    btn.addEventListener('mouseleave', () => btn.classList.remove('pressed'));
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); btn.classList.add('pressed'); }, {passive:false});
    btn.addEventListener('touchend', (e) => { e.preventDefault(); btn.classList.remove('pressed'); addTree(); });

    function launchConfetti() {
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const p = document.createElement('div'); p.className = 'confetti-piece';
          p.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
          p.style.left = (5 + Math.random() * 90) + '%';
          p.style.animationDuration = (1.0 + Math.random() * 0.7) + 's';
          confettiEl.appendChild(p); setTimeout(() => p.remove(), 1800);
        }, i * 50);
      }
    }
  </script>
</body>
</html>
